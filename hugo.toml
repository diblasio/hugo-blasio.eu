baseURL = 'https://blasio.eu'
languageCode = 'en-us'
title = 'Blasio'

theme = 'lume'

[params]
  author = 'David Di Blasio Jr.'
  description = 'A personal photoblog by David Di Blasio Jr.'
  copyrightName = 'David Di Blasio Jr.'
  themeCreditURL = 'https://github.com/diblasio/Lume'
  manifestThemeColorDark = '#0f0f10'

[mediaTypes."application/manifest+json"]
  suffixes = ['webmanifest']

[outputFormats]
  [outputFormats.webmanifest]
    mediaType = 'application/manifest+json'
    baseName = 'manifest'
    isPlainText = true
    notAlternative = true

[permalinks]
  posts = '/posts/:slug/'

[build]
  buildFuture = true

[outputs]
  home = ['HTML', 'RSS', 'webmanifest']
  section = ['HTML']
  taxonomy = ['HTML']
  term = ['HTML']
